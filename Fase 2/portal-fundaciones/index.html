<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#c2410c" />
    <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
    <meta name="description" content="Portal de fundaciones Adoptify. Un espacio para acompañar a animales rescatados hacia un nuevo hogar." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adoptify | Un nuevo hogar</title>
  </head>
  <body>
    <script>
      // Aplica el modo oscuro antes de pintar (misma lógica que hooks/useTheme.ts)
      (function () {
        var theme = null
        try { theme = localStorage.getItem('adoptify_theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
